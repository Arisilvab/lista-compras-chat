<script>
  const input = document.getElementById('input');
  const messages = document.getElementById('messages');

  input.addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') {
      const userMsg = input.value;
      appendMessage('user', userMsg);
      input.value = '';

      try {
        const gptResponse = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userInput: userMsg })
        });

        const gptData = await gptResponse.json();

        // Tenta transformar em JSON (GPT sempre retorna como texto)
        const parsed = JSON.parse(gptData.result);
        const { dados, ingredientes } = parsed;

        // Mostra resumo da interpretação
        appendMessage('bot', `
          Entendi! Vamos alimentar <b>${dados.pessoas}</b> pessoa(s) com orçamento de <b>R$${dados.orcamento}</b>
          em uma lista <b>${dados.frequencia}</b> para <b>${dados.cidade || '...'}/${dados.estado}</b>.<br>
          Ingredientes sugeridos: ${ingredientes.join(', ')}<br><br>Consultando preços reais...
        `);

        // Envia para a API do Render
        const listaResponse = await fetch("https://lista-compras-vtxx.onrender.com/gerar-lista", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            cidade: dados.cidade,
            estado: dados.estado,
            orcamento: dados.orcamento,
            ingredientes: ingredientes
          })
        });

        const lista = await listaResponse.json();

        const produtos = lista.lista.map(p => `- ${p.produto}: R$${p.preco.toFixed(2)}`).join('<br>');
        appendMessage('bot', `
          🛒 Aqui está sua lista de compras personalizada:<br><br>
          ${produtos}<br><br><b>Total:</b> R$${lista.total.toFixed(2)}
        `);
      } catch (err) {
        console.error(err);
        appendMessage('bot', `⚠️ Desculpe, não entendi. Pode repetir com cidade, estado, orçamento e para quantas pessoas é a lista?`);
      }
    }
  });

  function appendMessage(sender, text) {
    const msg = document.createElement('div');
    msg.className = `msg ${sender}`;
    msg.innerHTML = `<div class="${sender}">${text}</div>`;
    messages.appendChild(msg);
  }
</script>
